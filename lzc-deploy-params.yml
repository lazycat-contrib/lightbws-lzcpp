params:
  - id: admin_username
    type: string
    name: "Administrator username"
    description: "Username for the initial LightBWS administrator"
    default_value: "admin"
    optional: false

  - id: admin_password
    type: secret
    name: "Administrator password"
    description: "Password for the initial LightBWS administrator (at least 6 characters)"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_username:
      name: "管理员用户名"
      description: "首次启动时创建的 LightBWS 管理员用户名"
    admin_password:
      name: "管理员密码"
      description: "首次启动时创建的 LightBWS 管理员密码（至少 6 个字符）"
